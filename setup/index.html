<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Birthday Mission｜API Test</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: #fff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 480px;

      background: #1c1c1c;

      border-radius: 24px;

      padding: 28px;

      box-shadow:
        0 20px 60px rgba(0,0,0,.35);
    }

    .label {
      font-size: 12px;
      letter-spacing: .16em;
      opacity: .55;
    }

    h1 {
      font-size: 26px;
      margin:
        8px 0
        8px;
    }

    .description {
      opacity: .7;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    button {
      width: 100%;
      min-height: 54px;

      border: 0;
      border-radius: 14px;

      font-size: 16px;
      font-weight: 600;

      cursor: pointer;

      margin-bottom: 12px;
    }

    #getBtn {
      background: #fff;
      color: #111;
    }

    #postBtn {
      background: #e6e1d7;
      color: #111;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .result {
      margin-top: 18px;

      padding: 16px;

      border-radius: 14px;

      background: #090909;

      font-size: 14px;
      line-height: 1.7;

      word-break: break-word;

      min-height: 80px;
    }

    .ok {
      color: #88e29c;
    }

    .error {
      color: #ff8e8e;
    }

  </style>

</head>

<body>

  <main class="card">

    <div class="label">
      PHASE 03
    </div>

    <h1>
      API CONNECTION TEST
    </h1>

    <p class="description">
      GitHub Pages → Apps Script
      前後端連線驗收
    </p>

    <button
      id="getBtn"
      type="button"
    >
      ① 測試 GET
    </button>

    <button
      id="postBtn"
      type="button"
    >
      ② 測試 POST
    </button>

    <div
      id="result"
      class="result"
    >
      尚未測試
    </div>

  </main>


  <script src="../assets/js/config.js"></script>

  <script>

    const result =
      document.getElementById('result');

    const getBtn =
      document.getElementById('getBtn');

    const postBtn =
      document.getElementById('postBtn');


    function showLoading(text) {

      result.className = 'result';

      result.textContent = text;

    }


    function showSuccess(data) {

      result.className =
        'result ok';

      result.textContent =
        JSON.stringify(
          data,
          null,
          2
        );

    }


    function showError(error) {

      console.error(error);

      result.className =
        'result error';

      result.textContent =
        '連線失敗：\n' +
        (
          error?.message ||
          String(error)
        );

    }


    getBtn.addEventListener(
      'click',
      async () => {

        getBtn.disabled = true;

        showLoading(
          'GET 連線中...'
        );

        try {

          const url =
            BM_CONFIG.API_URL +
            '?action=ping&_=' +
            Date.now();

          const response =
            await fetch(
              url,
              {
                method: 'GET',
                redirect: 'follow',
                cache: 'no-store'
              }
            );

          if (!response.ok) {
            throw new Error(
              'HTTP ' +
              response.status
            );
          }

          const data =
            await response.json();

          if (
            data.ok !== true ||
            data.action !== 'ping'
          ) {
            throw new Error(
              'GET 回傳內容不正確'
            );
          }

          showSuccess({
            test: 'GET PASS',
            ...data
          });

        } catch (error) {

          showError(error);

        } finally {

          getBtn.disabled = false;

        }

      }
    );


    postBtn.addEventListener(
      'click',
      async () => {

        postBtn.disabled = true;

        showLoading(
          'POST 連線中...'
        );

        try {

          const response =
            await fetch(
              BM_CONFIG.API_URL,
              {

                method: 'POST',

                redirect: 'follow',

                headers: {
                  'Content-Type':
                    'text/plain;charset=utf-8'
                },

                body:
                  JSON.stringify({
                    action:
                      'pingPost',

                    test:
                      'github-pages'
                  })

              }
            );

          if (!response.ok) {
            throw new Error(
              'HTTP ' +
              response.status
            );
          }

          const data =
            await response.json();

          if (
            data.ok !== true ||
            data.action !==
              'pingPost'
          ) {
            throw new Error(
              'POST 回傳內容不正確'
            );
          }

          showSuccess({
            test: 'POST PASS',
            ...data
          });

        } catch (error) {

          showError(error);

        } finally {

          postBtn.disabled = false;

        }

      }
    );

  </script>

</body>
</html>
